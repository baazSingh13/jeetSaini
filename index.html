<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Quicksand:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: ["class"],
            theme: {
                container: {
                    center: true,
                    padding: "2rem",
                    screens: {
                        "2xl": "1400px",
                    },
                },
                extend: {
                    colors: {
                        border: "hsl(var(--border))",
                        input: "hsl(var(--input))",
                        ring: "hsl(var(--ring))",
                        background: "hsl(var(--background))",
                        foreground: "hsl(var(--foreground))",
                        primary: {
                            DEFAULT: "hsl(var(--primary))",
                            foreground: "hsl(var(--primary-foreground))",
                        },
                        secondary: {
                            DEFAULT: "hsl(var(--secondary))",
                            foreground: "hsl(var(--secondary-foreground))",
                        },
                        destructive: {
                            DEFAULT: "hsl(var(--destructive))",
                            foreground: "hsl(var(--destructive-foreground))",
                        },
                        muted: {
                            DEFAULT: "hsl(var(--muted))",
                            foreground: "hsl(var(--muted-foreground))",
                        },
                        accent: {
                            DEFAULT: "hsl(var(--accent))",
                            foreground: "hsl(var(--accent-foreground))",
                        },
                        popover: {
                            DEFAULT: "hsl(var(--popover))",
                            foreground: "hsl(var(--popover-foreground))",
                        },
                        card: {
                            DEFAULT: "hsl(var(--card))",
                            foreground: "hsl(var(--card-foreground))",
                        },
                    },
                    borderRadius: {
                        lg: "var(--radius)",
                        md: "calc(var(--radius) - 2px)",
                        sm: "calc(var(--radius) - 4px)",
                    },
                    fontFamily: {
                        display: ["Dancing Script", "cursive"],
                        body: ["Quicksand", "sans-serif"],
                    },
                    keyframes: {
                        float: {
                            "0%, 100%": { transform: "translateY(0) rotate(0deg)", opacity: "1" },
                            "50%": { transform: "translateY(-20px) rotate(5deg)", opacity: "0.8" },
                        },
                        heartBurst: {
                            "0%": { transform: "scale(0)", opacity: "1" },
                            "50%": { transform: "scale(1.3)", opacity: "0.8" },
                            "100%": { transform: "scale(1)", opacity: "1" },
                        },
                    },
                    animation: {
                        float: "float 3s ease-in-out infinite",
                        "heart-burst": "heartBurst 0.6s ease-out",
                    },
                },
            },
        }
    </script>
    <style type="text/tailwindcss">
        @layer base {
            :root {
                --background: 340 80% 95%;
                --foreground: 340 60% 20%;
                --card: 340 70% 97%;
                --card-foreground: 340 60% 20%;
                --popover: 0 0% 100%;
                --popover-foreground: 340 60% 20%;
                --primary: 340 82% 52%;
                --primary-foreground: 0 0% 100%;
                --secondary: 340 60% 88%;
                --secondary-foreground: 340 60% 25%;
                --muted: 340 40% 90%;
                --muted-foreground: 340 20% 50%;
                --accent: 15 90% 60%;
                --accent-foreground: 0 0% 100%;
                --destructive: 0 84.2% 60.2%;
                --destructive-foreground: 210 40% 98%;
                --border: 340 40% 85%;
                --input: 340 40% 85%;
                --ring: 340 82% 52%;
                --radius: 1rem;
            }
            body {
                @apply bg-background text-foreground font-body border-border;
            }
        }
    </style>
</head>

<body class="overflow-hidden">
    <div id="app" class="relative min-h-screen flex flex-col items-center justify-center p-6 text-center">
        <!-- Views will be injected here -->
    </div>

    <!-- Templates -->
    <template id="proposal-view">
        <div class="background-hearts absolute inset-0 pointer-events-none"></div>

        <div class="relative z-10 flex flex-col items-center">
            <i data-lucide="heart" class="mb-6 h-20 w-20 fill-primary text-primary animate-float"></i>

            <h1 class="font-display text-5xl font-bold text-foreground md:text-7xl">
                Will you be my Valentine?
            </h1>
            <p class="mt-3 text-lg text-muted-foreground md:text-xl">
                There's only one right answer...
            </p>

            <div class="relative mt-10 flex h-32 w-full max-w-md items-center justify-center gap-6"
                id="button-container">
                <button id="yes-btn"
                    class="z-10 rounded-full bg-primary px-10 py-4 text-xl font-bold text-primary-foreground shadow-lg transition-transform hover:scale-110 active:scale-95">
                    Yes!
                </button>

                <button id="no-btn"
                    class="z-10 rounded-full bg-secondary px-10 py-4 text-xl font-bold text-secondary-foreground shadow transition-all duration-200">
                    No
                </button>
            </div>

            <p id="cheeky-text" class="mt-4 text-sm text-muted-foreground animate-pulse hidden">
                Hehe, you can't say no!
            </p>
        </div>
    </template>

    <template id="success-view">
        <div class="flex flex-col items-center justify-center animate-heart-burst">
            <i data-lucide="heart" class="mx-auto mb-6 h-24 w-24 fill-primary text-primary"></i>
        </div>
        <h1 class="font-display text-5xl font-bold text-foreground md:text-7xl">
            Yaaay!
        </h1>
        <p class="mt-4 text-xl text-muted-foreground md:text-2xl">
            Congratulations, you will be <span class="font-bold text-primary">Gurjit's Valentine</span>!
        </p>
        <p class="mt-2 font-display text-2xl text-foreground md:text-3xl">
            You just made someone the happiest person ever
        </p>

        <a href="https://www.instagram.com/narfi_vali_duo" target="_blank" rel="noopener noreferrer"
            class="mt-8 inline-flex items-center gap-2 rounded-full bg-primary px-6 py-3 text-lg font-semibold text-primary-foreground transition-transform hover:scale-105">
            <i data-lucide="instagram" class="h-5 w-5"></i>
            @narfi_vali_duo
        </a>

        <div class="floating-hearts fixed inset-0 pointer-events-none"></div>
    </template>

    <script>
        const app = document.getElementById('app');
        const proposalTemplate = document.getElementById('proposal-view');
        const successTemplate = document.getElementById('success-view');

        function renderProposal() {
            app.innerHTML = '';
            const clone = proposalTemplate.content.cloneNode(true);
            app.appendChild(clone);

            // Add background hearts
            const bgContainer = app.querySelector('.background-hearts');
            for (let i = 0; i < 8; i++) {
                const heart = document.createElement('i');
                heart.dataset.lucide = "heart";
                // Tailwind classes for absolute positioning and animation
                heart.className = "animate-float absolute fill-primary/10 text-primary/10";

                // Random styles
                const left = Math.random() * 90 + 5;
                const top = Math.random() * 90 + 5;
                const width = Math.random() * 30 + 16;
                const delay = Math.random() * 3;
                const duration = 2 + Math.random() * 4;

                heart.style.left = `${left}%`;
                heart.style.top = `${top}%`;
                heart.style.width = `${width}px`;
                heart.style.height = `${width}px`; // ensure aspect ratio
                heart.style.animationDelay = `${delay}s`;
                heart.style.animationDuration = `${duration}s`;

                bgContainer.appendChild(heart);
            }

            // Logic for No button
            const noBtn = document.getElementById('no-btn');
            const cheekyText = document.getElementById('cheeky-text');
            const btnContainer = document.getElementById('button-container');

            let moved = false;

            const moveNoButton = () => {
                if (!btnContainer) return;
                const rect = btnContainer.getBoundingClientRect();
                const maxX = rect.width - 120; // approximate width of button
                const maxY = rect.height - 50; // approximate height

                // Calculate random position relative to container center usually, 
                // but here relative to initial position which is centered.
                // React code used: x = random * maxX - maxX/2.

                const x = Math.random() * maxX - maxX / 2;
                const y = Math.random() * maxY - maxY / 2;

                noBtn.style.position = 'absolute';
                noBtn.style.transform = `translate(${x}px, ${y}px)`;

                if (!moved) {
                    moved = true;
                    cheekyText.classList.remove('hidden');
                }
            };

            noBtn.addEventListener('mouseenter', moveNoButton);
            noBtn.addEventListener('touchstart', moveNoButton);
            noBtn.addEventListener('click', moveNoButton);

            // Logic for Yes button
            const yesBtn = document.getElementById('yes-btn');
            yesBtn.addEventListener('click', renderSuccess);

            lucide.createIcons();
        }

        function renderSuccess() {
            app.innerHTML = '';
            const clone = successTemplate.content.cloneNode(true);
            app.appendChild(clone);

            // Floating hearts
            const floatsContainer = app.querySelector('.floating-hearts');
            for (let i = 0; i < 12; i++) {
                const heart = document.createElement('i');
                heart.dataset.lucide = "heart";
                heart.className = "animate-float fixed fill-primary/30 text-primary/30";

                const left = Math.random() * 90 + 5;
                const top = Math.random() * 90 + 5;
                const width = Math.random() * 24 + 12;
                const delay = Math.random() * 3;
                const duration = 2 + Math.random() * 3;

                heart.style.left = `${left}%`;
                heart.style.top = `${top}%`;
                heart.style.width = `${width}px`;
                heart.style.height = `${width}px`;
                heart.style.animationDelay = `${delay}s`;
                heart.style.animationDuration = `${duration}s`;

                floatsContainer.appendChild(heart);
            }

            lucide.createIcons();
        }

        // Initial Render
        renderProposal();
    </script>
</body>

</html>
